<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Us — a private question game for two</title>
  <meta name="description" content="A private question game for two. Answer independently, reveal together.">
  <meta name="csrf-token" content="{{ csrf_token_value() }}">

  <meta name="theme-color" content="#FFF9F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B1420" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Us">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/style.css">

  <script>
    // Applied before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var pref = localStorage.getItem('us_theme_pref') || 'system';
        var resolved = pref === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        document.documentElement.setAttribute('data-theme', resolved);
      } catch (e) { /* localStorage unavailable - default styling applies */ }
    })();
  </script>
</head>
<body>
  <div id="app">

    <!-- Initial loading splash -->
    <div id="view-loading" class="screen screen-center">
      <div class="brand-mark" aria-hidden="true">❤</div>
      <p class="loading-label">Us</p>
    </div>

    <!-- Onboarding: welcome / create couple / join couple -->
    <section id="view-onboarding" class="screen hidden"></section>

    <!-- Main app shell, shown once authenticated -->
    <div id="app-shell" class="app-shell hidden">
      <header class="topbar">
        <div class="topbar-couple">
          <div class="avatar-pair" id="topbar-avatars"></div>
          <span class="topbar-name" id="topbar-couple-name">Us</span>
        </div>
        <button class="icon-btn" id="topbar-settings-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
        </button>
      </header>

      <main id="view-container" class="view-container">
        <section id="view-home" class="view hidden"></section>
        <section id="view-games" class="view hidden"></section>
        <section id="view-questions" class="view hidden"></section>
        <section id="view-memories" class="view hidden"></section>
        <section id="view-stats" class="view hidden"></section>
        <section id="view-settings" class="view hidden"></section>
      </main>

      <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-btn" data-view="home" aria-label="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-btn" data-view="games" aria-label="Games">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="12" rx="4"/><path d="M8 11v4M6 13h4"/><circle cx="15.5" cy="11.5" r=".6" fill="currentColor" stroke="none"/><circle cx="17.5" cy="13.5" r=".6" fill="currentColor" stroke="none"/></svg>
          <span>Games</span>
        </button>
        <button class="nav-btn" data-view="questions" aria-label="Questions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.29c-.7.32-1 .81-1 1.71v.5"/><circle cx="12" cy="17" r=".6" fill="currentColor" stroke="none"/><rect x="3.5" y="3.5" width="17" height="17" rx="4"/></svg>
          <span>Questions</span>
        </button>
        <button class="nav-btn" data-view="memories" aria-label="Memories">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.2"/><path d="M3.5 9h17"/><circle cx="8" cy="13.2" r="1.6"/><path d="M8 20 12.2 15.5a1.4 1.4 0 0 1 2 0L18 20"/></svg>
          <span>Memories</span>
        </button>
        <button class="nav-btn" data-view="stats" aria-label="Stats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
          <span>Stats</span>
        </button>
        <button class="nav-btn" data-view="settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M4.5 20c1.4-3.6 4.3-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>
          <span>Settings</span>
        </button>
      </nav>
    </div>

    <!-- Full-screen round sheet: answering / waiting / reveal, used from Home, Questions and Memories -->
    <div id="round-modal" class="modal hidden" role="dialog" aria-modal="true"></div>

    <!-- Generic confirm dialog -->
    <div id="confirm-modal" class="modal hidden" role="alertdialog" aria-modal="true"></div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
